<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<!-- head要素ここから -->

<head th:replace="~{user/common :: user-header('アカウント設定画面', ~{::extraHead})}">
	<!-- ページ固有の情報をheaderに追加 -->
	<th:block th:fragment="extraHead">
		<!-- 自作個別css -->
		<link rel="stylesheet" media="all" th:href="@{/css/main-contents/user/accountSetting.css}">
		<link rel="stylesheet" media="all" th:href="@{/psfm/css/fragment/signin.css}">
		<link rel="stylesheet" media="all" th:href="@{/psfm/css/fragment/body.css}">
		<link rel="stylesheet" media="all" th:href="@{/psfm/css/fragment/breadcrump.css}">
		<link rel="stylesheet" media="all" th:href="@{/psfm/css/fragment/form.css}">
		<link rel="stylesheet" media="all" th:href="@{/psfm/css/fragment/validation.css}">
		<link rel="stylesheet" media="all" th:href="@{/psfm/css/fragment/alert.css}">
		<!-- 自作個別js -->
		<script type="module" th:src="@{/js/main-contents/user/accountSetting/controller.js}"></script>
	</th:block>
</head>
<!-- head要素ここまで -->
<!-- body要素ここから -->

<body>
	<!-- navbar -->
	<div th:replace="~{user/navbar :: user-navbar}"></div>
	<!-- main-contents -->
	<main class="my-container-left">
		<!-- breadcrump -->
		<div class="my-breadcrump-simple">
			<nav>
				<ol>
					<li>アカウント設定</li>
				</ol>
			</nav>
		</div>
		<!-- form -->
		<form th:action="@{/user/account/update}" th:object="${usersForm}" class="my-validation-input-change"
			method="post" id="update-form">
			<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
			<!-- alert -->
			<div class="alert-area" th:if="${errorMessage != null}">
				<div th:if="${alertDanger}" class="my-alert-danger" th:data-text="${errorMessage}"></div>
			</div>
			<div class="my-form-message"></div>
			<div class="my-validation-container">
				<div class="my-form-input" data-text="パスワード">
					<input th:field="*{username}" type="text" required minlength="8" maxlength="20">
				</div>
				<div class="my-invalid" th:data-text="${usernameInvalidMessage} ?:''"></div>
			</div>
			<div class="btn-area">
				<button type="button" class="my-btn-primary my-modal-open" data-modal="#update-modal">更新</button>
				<a th:href="@{/user}" class="my-btn-secondary">キャンセル</a>
			</div>
		</form>
		<!-- パスワードリセットフォーム -->
		<form th:action="@{/user/account/passwordReset}" method="post" id="pass-reset-form">
			<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
			<button type="button" class="my-btn-warning my-modal-open" data-modal="#pass-reset-modal">パスワードリセット</button>
		</form>
	</main>
	
	<!-- browser-guard -->
	<div th:replace="~{user/browser-guard :: user-browser-guard}"></div>
	<!-- footer -->
	<div th:replace="~{user/footer :: user-footer}"></div>

	<!-- modal -->
	<!-- ユーザー名更新確認モーダル -->
	<div class="my-modal my-modal-dark" id="update-modal" data-bind-from="input[name='username']"
		data-bind-to=".js-modal-text" data-bind-template="「{value}」に更新してよろしいですか？">
		<div class="my-modal-contents">
			<div class="my-modal-dialog">
				<div class="my-modal-content">
					<div class="my-modal-header">
						<h5 class="my-modal-title">ユーザー名更新確認</h5>
						<button type="button" class="my-btn-dark" data-dismiss>&times;</button>
					</div>
					<div class="my-modal-body">
						<p class="js-modal-text"></p>
					</div>
					<div class="my-modal-footer">
						<button type="button" class="my-btn-secondary" data-dismiss>キャンセル</button>
						<!-- このボタンで “開いたトリガーと同じフォーム” を送信 -->
						<button type="submit" class="my-btn-primary" data-submit-form="#update-form">更新</button>
					</div>
				</div>
			</div>
		</div>
	</div>
	<!-- パスワードリセット確認モーダル -->
	<div class="my-modal my-modal-dark" id="pass-reset-modal">
		<div class="my-modal-contents">
			<div class="my-modal-dialog">
				<div class="my-modal-content">
					<div class="my-modal-header">
						<h5 class="my-modal-title">パスワードリセット確認</h5>
						<button type="button" class="my-btn-dark" data-dismiss>&times;</button>
					</div>
					<div class="my-modal-body">
						<p>パスワードを初期化してもよろしいですか？</p>
					</div>
					<div class="my-modal-footer">
						<button type="button" class="my-btn-secondary" data-dismiss>キャンセル</button>
						<button type="submit" class="my-btn-warning"
							data-submit-form="#pass-reset-form">パスワードリセット</button>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>
<!-- body要素ここまで -->

</html>
