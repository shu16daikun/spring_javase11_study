<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<!-- head要素ここから -->

<head th:replace="~{user/common :: user-header('章選択画面', ~{::extraHead})}">
	<!-- ページ固有の情報をheaderに追加 -->
	<th:block th:fragment="extraHead">
		<!-- 自作個別css -->
		<link rel="stylesheet" media="all" th:href="@{/psfm/css/fragment/breadcrump.css}">
		<link rel="stylesheet" media="all" th:href="@{/psfm/css/fragment/listGroup.css}">
		<!-- 自作個別js -->
		<script type="module" th:src="@{/js/main-contents/user/chapter/controller.js}"></script>
	</th:block>
</head>
<!-- head要素ここまで -->
<!-- body要素ここから -->

<body class="my-items-center-body">
	<!-- navbar -->
	<div th:replace="~{user/navbar :: user-navbar}"></div>

	<!-- main-contents -->
	<main class="my-container">
		<!-- breadcrump -->
		<div class="my-breadcrump-simple">
			<nav>
				<ol>
					<li><a th:href="@{/user}">ホーム</a></li>
					<li><a th:href="@{/user/sankouBooks}">黒本問題集</a></li>
					<li th:text="${sankouBooksViewDto.name}"></li>
				</ol>
			</nav>
		</div>

		<!-- listGroup -->
		<div class="list-group-area">
			<div class="my-list-group">
				<ol>
					<li th:each="chapter : ${chapterViewDtoList}">
						<!--
							aタグの見た目は維持しつつ、
							実際の遷移は JS + 共通フォームで POST する
						-->
						<a href="#"
						   class="js-chapter-link"
						   th:attr="data-book-view-id=${sankouBooksViewDto.viewId},
						            data-chapter-no=${chapter.no}"
						   th:text="${chapter.no + '章    ' + chapter.name}">
						</a>
					</li>
				</ol>
			</div>
		</div>
	</main>
	
	<!-- browser-guard -->
	<div th:replace="~{user/browser-guard :: user-browser-guard}"></div>
	<!-- footer -->
	<div th:replace="~{user/footer :: user-footer}"></div>

	<!-- ▼ 章遷移用：/user/sankouBooks/{bookId}/{chapterNo}/browser-guard へPOSTする共通フォーム -->
	<form id="chapter-form"
	      method="post"
	      th:attr="data-action-prefix=@{/user/sankouBooks/},data-action-suffix='/browser-guard'">
		<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
		<input type="hidden" name="pageToken" th:value="${pageToken}" />
	</form>
</body>
<!-- body要素ここまで -->

</html>
