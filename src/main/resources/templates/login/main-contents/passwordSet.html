<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<!-- head要素ここから -->

<head th:replace="~{login/common :: login-header('パスワード設定画面', ~{::extraHead})}">
	<!-- ページ固有の情報をheaderに追加 -->
	<th:block th:fragment="extraHead">
		<!-- 自作個別css -->
		<link rel="stylesheet" media="all" th:href="@{/css/main-contents/login/passwordSet.css}">
		<link rel="stylesheet" media="all" th:href="@{/psfm/css/fragment/signin.css}">
		<link rel="stylesheet" media="all" th:href="@{/psfm/css/fragment/body.css}">
		<link rel="stylesheet" media="all" th:href="@{/psfm/css/fragment/form.css}">
		<link rel="stylesheet" media="all" th:href="@{/psfm/css/fragment/validation.css}">
		<link rel="stylesheet" media="all" th:href="@{/psfm/css/fragment/alert.css}">
		<!-- 自作個別js -->
		<script type="module" th:src="@{/js/main-contents/login/passwordSet/controller.js}"></script>
	</th:block>
</head>
<!-- head要素ここまで -->
<!-- body要素ここから -->

<body class="my-items-center-body">
	<div th:replace="~{psfm/fragment/svg/icons :: svg-icons}"></div>
	<main class="my-form-signin">
		<!-- form -->
		<form th:action="@{/login/passwordSet}" th:object="${passwordSetForm}" class="my-validation-input-change"
			method="post">
			<!-- alert -->
			<div class="alert-area">
				<div class="my-alert-danger" th:data-text="${errorMessage}"></div>
			</div>
			<div class="my-form-message">
				<span th:text="${passwordSetViewDto.username}"></span><span> さん</span><br>
				<span>新しいパスワードを設定してください。</span>
			</div>
			<div class="my-validation-container">
				<div class="my-form-input" data-text="パスワード">
					<input th:field="*{password}" type="password">
				</div>
				<div class="my-invalid" th:data-text="${passInvalidMessage} ?:''" th:error="*{password}"></div>
			</div>
			<div class="my-validation-container">
				<div class="my-form-input" data-text="パスワード確認用">
					<input th:field="*{passwordCheck}" type="password">
				</div>
				<div class="my-invalid" th:data-text="${passInvalidMessage} ?:''" th:error="*{passwordCheck}"></div>
			</div>
			<div class="btn-area">
				<button class="my-btn-primary" type="submit">パスワード設定</button>
			</div>
		</form>
		<!-- ログアウトフォーム（キャンセル） -->
		<form th:action="@{/logout}" method="post" class="inline-form">
			<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
			<div class="btn-area">
				<button type="submit" class="my-btn-secondary">キャンセル</button>
			</div>
		</form>
	</main>
	
	<!-- browser-guard -->
	<div th:replace="~{login/browser-guard :: login-browser-guard}"></div>
	<!-- body要素ここまで -->
</body>

</html>
