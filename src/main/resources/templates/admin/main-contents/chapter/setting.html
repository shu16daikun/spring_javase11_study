<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<!-- head要素ここから -->

<head th:replace="~{admin/common :: admin-header('管理者_章設定画面', ~{::extraHead})}">
	<!-- ページ固有の情報をheaderに追加 -->
	<th:block th:fragment="extraHead">
		<!-- 自作個別css -->
		<link rel="stylesheet" media="all" th:href="@{/css/main-contents/admin/chapter/setting.css}">
		<link rel="stylesheet" media="all" th:href="@{/psfm/css/fragment/breadcrump.css}">
		<link rel="stylesheet" media="all" th:href="@{/psfm/css/fragment/table.css}">
		<link rel="stylesheet" media="all" th:href="@{/psfm/css/fragment/buttons.css}">
		<link rel="stylesheet" media="all" th:href="@{/psfm/css/fragment/pagination.css}">

		<!-- 自作個別js -->
		<script type="module" th:src="@{/js/main-contents/admin/chapter/setting/controller.js}"></script>
	</th:block>
</head>
<!-- head要素ここまで -->
<!-- body要素ここから -->

<body class="my-items-center-body">
	<!-- navbar -->
	<div th:replace="~{admin/navbar :: admin-navbar}"></div>

	<!-- main-contents -->
	<main class="my-container">
		<!-- breadcrump -->
		<div class="my-breadcrump-simple">
			<nav>
				<ol>
					<li><a th:href="@{/admin}">ホーム</a></li>
					<li>章設定</li>
				</ol>
			</nav>
		</div>

		<!-- btn-area -->
		<div class="btn-area my-card">
			<!-- aタグ → /admin/chapter/insert/browser-guard へのPOSTに変更 -->
			<form th:action="@{/admin/chapter/insert/browser-guard}"
			      method="post"
			      data-psfm-prevent-double-submit>
				<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
				<input type="hidden" name="pageToken" th:value="${pageToken}">
				<button type="submit" class="my-btn-success">新規作成</button>
			</form>
		</div>

		<!-- table -->
		<div class="table-area">
			<div class="my-table">
				<table>
					<thead>
						<tr>
							<th>データベースID</th>
							<th>画面表示用ID</th>
							<th>章番号</th>
							<th>章名</th>
							<th>参考書名</th>
							<th></th>
							<th></th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="ch : ${chapterViewDtoList}">
							<td th:text="${ch.id}">データベースID</td>
							<td th:text="${ch.viewId}">画面表示用ID</td>
							<td th:text="${ch.no}">章番号</td>
							<td th:text="${ch.name}">章名</td>
							<td th:text="${ch.sankouBooksViewDto.name}">参考書名</td>

							<!-- 詳細：共通フォームに投げるボタンへ変更 -->
							<td>
								<button type="button"
								        class="my-btn-primary js-chapter-detail"
								        th:attr="data-view-id=${ch.viewId}">
									詳細
								</button>
							</td>

							<!-- 使用中は削除不可 -->
							<td th:if="${ch.isUse}">
								<button class="my-btn-danger" disabled>削除不可</button>
							</td>
							<td th:unless="${ch.isUse}">
								<button type="button"
								        class="my-btn-danger my-modal-open js-chapter-delete"
								        data-modal="#delete-modal"
								        th:attr="data-view-id=${ch.viewId},
								                 data-name=${ch.name}">
									削除
								</button>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
			<nav class="my-pagination" id="chapter-pagination" aria-label="章ページ移動">
				<ul></ul>
			</nav>
		</div>
	</main>
	
	<!-- browser-guard -->
	<div th:replace="~{admin/browser-guard :: admin-browser-guard}"></div>

	<!-- footer -->
	<div th:replace="~{admin/footer :: admin-footer}"></div>

	<!-- ▼ 詳細用：中継URL /admin/chapter/{id}/browser-guard へPOSTする共通フォーム -->
	<form id="chapter-detail-form"
	      method="post"
	      th:attr="data-action-prefix=@{/admin/chapter/},data-action-suffix='/browser-guard'">
		<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
		<input type="hidden" name="pageToken" th:value="${pageToken}">
	</form>

	<!-- 削除処理フォーム -->
	<form id="delete-form"
		  method="post"
		  th:attr="data-action-prefix=@{/admin/chapter/},data-action-suffix='/delete'">
		<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
		<!-- pageToken hidden（POST用） -->
		<input type="hidden" name="pageToken" th:value="${pageToken}">
	</form>

	<!-- 削除確認モーダル -->
	<div class="my-modal my-modal-dark" id="delete-modal">
		<div class="my-modal-contents">
			<div class="my-modal-dialog">
				<div class="my-modal-content">
					<div class="my-modal-header">
						<h5 class="my-modal-title">章削除確認</h5>
						<button type="button" class="my-btn-dark" data-dismiss>&times;</button>
					</div>
					<div class="my-modal-body">
						<p>章「<span id="delete-target-name"></span>」を削除してよろしいですか？</p>
					</div>
					<div class="my-modal-footer">
						<button type="button" class="my-btn-secondary" data-dismiss>キャンセル</button>
						<button type="submit" class="my-btn-danger" data-submit-form="#delete-form">削除</button>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>
<!-- body要素ここまで -->

</html>
