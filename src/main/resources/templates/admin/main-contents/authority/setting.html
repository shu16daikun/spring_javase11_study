<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<!-- head要素ここから -->

<head th:replace="~{admin/common :: admin-header('管理者_権限設定画面', ~{::extraHead})}">
	<!-- ページ固有の情報をheaderに追加 -->
	<th:block th:fragment="extraHead">
		<!-- 自作個別css -->
		<link rel="stylesheet" media="all" th:href="@{/css/main-contents/admin/authority/setting.css}">
		<link rel="stylesheet" media="all" th:href="@{/psfm/css/fragment/breadcrump.css}">
		<link rel="stylesheet" media="all" th:href="@{/psfm/css/fragment/table.css}">
		<link rel="stylesheet" media="all" th:href="@{/psfm/css/fragment/buttons.css}">
		<link rel="stylesheet" media="all" th:href="@{/psfm/css/fragment/pagination.css}">

		<!-- 自作個別js -->
		<script type="module" th:src="@{/js/main-contents/admin/authority/setting/controller.js}"></script>
	</th:block>
</head>
<!-- head要素ここまで -->
<!-- body要素ここから -->

<body class="my-items-center-body">
	<!-- navbar -->
	<div th:replace="~{admin/navbar :: admin-navbar}"></div>
	<!-- main-contents -->
	<main class="my-container">
		<!-- breadcrump -->
		<div class="my-breadcrump-simple">
			<nav>
				<ol>
					<li><a th:href="@{/admin}">ホーム</a></li>
					<li>権限設定</li>
				</ol>
			</nav>
		</div>

		<!-- 追加ボタン：ここはそのままでOK -->
		<div class="btn-area">
			<form th:action="@{/admin/authority/insert/browser-guard}"
			      method="post"
			      data-psfm-prevent-double-submit>
				<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
				<button type="submit" class="my-btn-success">
					新規追加
				</button>
			</form>
		</div>

		<!-- table -->
		<div class="table-area">
			<div class="my-table">
				<table>
					<thead>
						<tr>
							<th>データベースID</th>
							<th>画面表示用ID</th>
							<th>権限名</th>
							<th></th>
							<th></th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="au : ${authorityViewDtoList}">
							<td th:text="${au.id}">データベースID</td>
							<td th:text="${au.viewId}">画面表示用ID</td>
							<td th:text="${au.systemName}">権限名</td>

							<!-- ▼ 詳細ボタン列 -->
							<!-- 予約IDは詳細不可 -->
							<td th:if="${au.id == 'AU0001' or au.id == 'AU0002'}">
								<button class="my-btn-primary" disabled>詳細不可</button>
							</td>
							<td th:unless="${au.id == 'AU0001' or au.id == 'AU0002'}">
								<!-- aタグ → 共通フォームを叩くボタンに変更 -->
								<button type="button"
								        class="my-btn-primary js-authority-detail"
								        th:attr="data-view-id=${au.viewId}">
									詳細
								</button>
							</td>

							<!-- ▼ 削除ボタン列 -->
							<!-- 予約ID or 利用中は削除不可 -->
							<td th:if="${au.id == 'AU0001' or au.id == 'AU0002' or au.isUse}">
								<button class="my-btn-danger" disabled>削除不可</button>
							</td>
							<td th:unless="${au.id == 'AU0001' or au.id == 'AU0002' or au.isUse}">
								<!-- 削除モーダル起動ボタン -->
								<button type="button"
								        class="my-btn-danger my-modal-open"
								        data-modal="#delete-modal"
								        th:attr="data-view-id=${au.viewId},
								                 data-name=${au.systemName}">
									削除
								</button>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
			<nav class="my-pagination" id="authority-pagination" aria-label="権限一覧ページ移動">
				<ul></ul>
			</nav>
		</div>
	</main>
	
	<!-- browser-guard -->
	<div th:replace="~{admin/browser-guard :: admin-browser-guard}"></div>
	<!-- footer -->
	<div th:replace="~{admin/footer :: admin-footer}"></div>

	<!-- ▼ 詳細画面用共通フォーム（/admin/authority/{viewId}/browser-guard へPOST） -->
	<form id="authority-detail-form"
	      method="post"
	      th:attr="data-action-prefix=@{/admin/authority/},data-action-suffix='/browser-guard'">
		<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
		<input type="hidden" name="pageToken" th:value="${pageToken}" />
	</form>

	<!-- ▼ 削除処理フォーム　-->
	<form id="delete-form"
	      method="post"
	      th:attr="data-action-prefix=@{/admin/authority/},data-action-suffix='/delete'">
		<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
		<!-- pageToken hidden（必要に応じて） -->
		<input type="hidden" name="pageToken" th:value="${pageToken}">
	</form>

	<!-- 削除確認モーダル -->
	<div class="my-modal my-modal-dark" id="delete-modal">
		<div class="my-modal-contents">
			<div class="my-modal-dialog">
				<div class="my-modal-content">
					<div class="my-modal-header">
						<h5 class="my-modal-title">権限削除確認</h5>
						<button type="button" class="my-btn-dark" data-dismiss>&times;</button>
					</div>
					<div class="my-modal-body">
						<p>権限名「<span id="delete-target-name"></span>」を削除してよろしいですか？</p>
					</div>
					<div class="my-modal-footer">
						<button type="button" class="my-btn-secondary" data-dismiss>
							キャンセル
						</button>
						<button type="submit" class="my-btn-danger" data-submit-form="#delete-form">
							削除
						</button>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>
<!-- body要素ここまで -->

</html>
