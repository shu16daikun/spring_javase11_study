<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<!-- head要素ここから -->

<head th:replace="~{admin/common :: admin-header('管理者_解答履歴設定画面', ~{::extraHead})}">
	<!-- ページ固有の情報をheaderに追加 -->
	<th:block th:fragment="extraHead">
		<!-- 自作個別css -->
		<link rel="stylesheet" media="all" th:href="@{/css/main-contents/admin/answer-records/setting.css}">
		<link rel="stylesheet" media="all" th:href="@{/psfm/css/fragment/breadcrump.css}">
		<link rel="stylesheet" media="all" th:href="@{/psfm/css/fragment/table.css}">
		<link rel="stylesheet" media="all" th:href="@{/psfm/css/fragment/buttons.css}">
		<link rel="stylesheet" media="all" th:href="@{/psfm/css/fragment/pagination.css}">

		<!-- 自作個別js -->
		<script type="module" th:src="@{/js/main-contents/admin/answer-records/setting/controller.js}"></script>
	</th:block>
</head>
<!-- head要素ここまで -->
<!-- body要素ここから -->

<body class="my-items-center-body">
	<!-- navbar -->
	<div th:replace="~{admin/navbar :: admin-navbar}"></div>
	<!-- main-contents -->
	<main class="my-container">
		<!-- breadcrump -->
		<div class="my-breadcrump-simple">
			<nav>
				<ol>
					<li><a th:href="@{/admin}">ホーム</a></li>
					<li>解答履歴閲覧</li>
				</ol>
			</nav>
		</div>
		<!-- table -->
		<div class="table-area">
			<div class="my-table">
				<table>
					<thead>
						<tr>
							<th>データベースID</th>
							<th>画面表示用ID</th>
							<th>ユーザ名</th>
							<th>参考書ID</th>
							<th>章NO</th>
							<th>問題NO</th>
							<th>セッションID</th>
							<th>解答選択肢</th>
							<th>正誤</th>
							<th>解答日時</th>
							<th>解答回数</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="ar : ${answerRecordsViewDtoList}">
							<td th:text="${ar.id}">データベースID</td>
							<td th:text="${ar.viewId}">画面表示用ID</td>
							<td th:text="${ar.usersViewDto.username}">ユーザ名</td>
							<td th:text="${ar.sankouBooksViewDto.name}">参考書名</td>
							<td th:text="${ar.chapterViewDto.no + '章 ' + ar.chapterViewDto.name}">章</td>
							<td th:text="${ar.questionsViewDto.questionNo}">問題NO</td>
							<td th:text="${ar.sessionViewDto.id}">セッションID</td>
							<td th:text="${ar.selectedOption}">解答選択肢</td>
							<td th:text="${ar.isCorrect}">正誤</td>
							<td th:text="${ar.answeredAt}">解答日時</td>
							<td th:text="${ar.attemptNo}">解答回数</td>
						</tr>
					</tbody>
				</table>
			</div>
			<nav class="my-pagination" id="answer-records-pagination" aria-label="解答履歴ページ移動">
				<ul></ul>
			</nav>
		</div>
	</main>
	
	<!-- browser-guard -->
	<div th:replace="~{admin/browser-guard :: admin-browser-guard}"></div>
	<!-- footer -->
	<div th:replace="~{admin/footer :: admin-footer}"></div>
</body>
<!-- body要素ここまで -->

</html>
