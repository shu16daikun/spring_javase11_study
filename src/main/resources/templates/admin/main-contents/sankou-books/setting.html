<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<!-- head要素ここから -->

<head th:replace="~{admin/common :: admin-header('管理者_参考書設定画面', ~{::extraHead})}">
	<!-- ページ固有の情報をheaderに追加 -->
	<th:block th:fragment="extraHead">
		<!-- 自作個別css -->
		<link rel="stylesheet" media="all" th:href="@{/css/main-contents/admin/sankou-books/setting.css}">
		<link rel="stylesheet" media="all" th:href="@{/psfm/css/fragment/breadcrump.css}">
		<link rel="stylesheet" media="all" th:href="@{/psfm/css/fragment/table.css}">
		<link rel="stylesheet" media="all" th:href="@{/psfm/css/fragment/buttons.css}">
		<link rel="stylesheet" media="all" th:href="@{/psfm/css/fragment/pagination.css}">

		<!-- 自作個別js -->
		<script type="module" th:src="@{/js/main-contents/admin/sankou-books/setting/controller.js}"></script>
	</th:block>
</head>
<!-- head要素ここまで -->
<!-- body要素ここから -->

<body class="my-items-center-body">
	<!-- navbar -->
	<div th:replace="~{admin/navbar :: admin-navbar}"></div>

	<!-- main-contents -->
	<main class="my-container">
		<!-- breadcrump -->
		<div class="my-breadcrump-simple">
			<nav>
				<ol>
					<li><a th:href="@{/admin}">ホーム</a></li>
					<li>参考書設定</li>
				</ol>
			</nav>
		</div>

		<!-- btn-area -->
		<div class="btn-area my-card">
			<!-- aタグ → /admin/sankouBooks/insert/browser-guard へのPOSTに変更 -->
			<form th:action="@{/admin/sankouBooks/insert/browser-guard}"
			      method="post"
			      data-psfm-prevent-double-submit>
				<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
				<input type="hidden" name="pageToken" th:value="${pageToken}">
				<button type="submit" class="my-btn-success">新規作成</button>
			</form>
		</div>

		<!-- table -->
		<div class="table-area">
			<div class="my-table">
				<table>
					<thead>
						<tr>
							<th>データベースID</th>
							<th>画面表示用ID</th>
							<th>参考書名</th>
							<th>参考書カラー</th>
							<th></th>
							<th></th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="sb : ${sankouBooksViewDtoList}">
							<td th:text="${sb.id}">データベースID</td>
							<td th:text="${sb.viewId}">画面表示用ID</td>
							<td th:text="${sb.name}">参考書名</td>
							<td th:text="${sb.colorViewDto.name}">参考書カラー</td>

							<!-- 詳細：中継URL用フォームを叩くボタン -->
							<td>
								<button type="button"
								        class="my-btn-primary js-sb-detail"
								        th:attr="data-view-id=${sb.viewId}">
									詳細
								</button>
							</td>

							<!-- 使用中は削除不可 -->
							<td th:if="${sb.isUse}">
								<button class="my-btn-danger" disabled>削除不可</button>
							</td>
							<td th:unless="${sb.isUse}">
								<button type="button"
								        class="my-btn-danger my-modal-open js-sb-delete"
								        data-modal="#delete-modal"
								        th:attr="data-view-id=${sb.viewId},
								                 data-name=${sb.name}">
									削除
								</button>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
			<nav class="my-pagination" id="sb-pagination" aria-label="参考書ページ移動">
				<ul></ul>
			</nav>
		</div>
	</main>

	<!-- browser-guard -->
	<div th:replace="~{admin/browser-guard :: admin-browser-guard}"></div>

	<!-- footer -->
	<div th:replace="~{admin/footer :: admin-footer}"></div>

	<!-- ▼ 詳細用：/admin/sankouBooks/{id}/browser-guard へPOSTする共通フォーム -->
	<form id="sb-detail-form"
	      method="post"
	      th:attr="data-action-prefix=@{/admin/sankouBooks/},data-action-suffix='/browser-guard'">
		<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
		<input type="hidden" name="pageToken" th:value="${pageToken}">
	</form>

	<!-- 削除処理フォーム -->
	<form id="delete-form"
	      method="post"
	      th:attr="data-action-prefix=@{/admin/sankouBooks/},data-action-suffix='/delete'">
		<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
		<input type="hidden" name="pageToken" th:value="${pageToken}">
	</form>

	<!-- 削除確認モーダル -->
	<div class="my-modal my-modal-dark" id="delete-modal">
		<div class="my-modal-contents">
			<div class="my-modal-dialog">
				<div class="my-modal-content">
					<div class="my-modal-header">
						<h5 class="my-modal-title">参考書削除確認</h5>
						<button type="button" class="my-btn-dark" data-dismiss>&times;</button>
					</div>
					<div class="my-modal-body">
						<p>参考書名「<span id="delete-target-name"></span>」を削除してよろしいですか？</p>
					</div>
					<div class="my-modal-footer">
						<button type="button" class="my-btn-secondary" data-dismiss>キャンセル</button>
						<button type="submit" class="my-btn-danger" data-submit-form="#delete-form">削除</button>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>
<!-- body要素ここまで -->

</html>
