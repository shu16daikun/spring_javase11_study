<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{admin/common :: admin-header('管理者_黒本問題修正画面', ~{::extraHead})}">
	<th:block th:fragment="extraHead">
		<link rel="stylesheet" media="all" th:href="@{/css/main-contents/admin/kurohon-questions/insertUpdate.css}">
		<link rel="stylesheet" media="all" th:href="@{/psfm/css/fragment/signin.css}">
		<link rel="stylesheet" media="all" th:href="@{/psfm/css/fragment/body.css}">
		<link rel="stylesheet" media="all" th:href="@{/psfm/css/fragment/buttons.css}">
		<link rel="stylesheet" media="all" th:href="@{/psfm/css/fragment/breadcrump.css}">
		<link rel="stylesheet" media="all" th:href="@{/psfm/css/fragment/form.css}">
		<link rel="stylesheet" media="all" th:href="@{/psfm/css/fragment/validation.css}">
		<link rel="stylesheet" media="all" th:href="@{/psfm/css/fragment/alert.css}">
		<link rel="stylesheet" media="all" th:href="@{/psfm/css/fragment/select.css}">
		<script type="module"
			th:src="@{/js/main-contents/admin/kurohon-questions/insert-update/controller.js}"></script>
	</th:block>
</head>

<body>
	<div th:replace="~{admin/navbar :: admin-navbar}"></div>

	<main class="my-container-left">
		<div class="my-breadcrump-simple">
			<nav>
				<ol>
					<li><a th:href="@{/admin}">ホーム</a></li>
					<li><a th:href="@{/admin/kurohonQuestions}">黒本問題設定</a></li>
					<li>黒本問題修正</li>
				</ol>
			</nav>
		</div>

		<form th:action="@{/admin/kurohonQuestions/{kurohon_questions_view_id}/update(kurohon_questions_view_id=${kurohon_questions_view_id})}"
			  th:object="${kurohonQuestionsForm}"
			  class="my-validation-input-change"
			  method="post"
			  id="insert-update-form"
			  novalidate>
			<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
			<!-- pageToken hidden -->
			<input type="hidden" name="pageToken" th:value="${pageToken}">
			<input type="hidden" name="viewId" th:value="${viewId} ?: ${kurohonQuestionsViewDto?.viewId}">

			<div class="alert-area" th:if="${errorMessage != null}">
				<div th:if="${alertDanger}" class="my-alert-danger" th:data-text="${errorMessage}"></div>
			</div>

			<div class="my-form-message"></div>

			<!-- 参考書 -->
			<div class="my-validation-container">
				<div class="my-form-input is-select" data-text="参考書">
					<select class="my-select" th:field="*{sankouBooksViewId}" aria-describedby="book-error" required>
						<option value="">選択してください</option>
						<option th:each="b : ${sankouBooksViewDtoList}"
								th:value="${b != null ? b.viewId : ''}"
								th:text="${b != null ? b.name : ''}">
							参考書
						</option>
					</select>
				</div>
				<div id="book-error" class="my-invalid" th:data-text="${bookInvalidMessage} ?: ''"></div>
			</div>

			<!-- 章 -->
			<div class="my-validation-container">
				<div class="my-form-input is-select" data-text="章">
					<select class="my-select" th:field="*{chapterViewId}" aria-describedby="chapter-error" required>
						<option value="">選択してください</option>
						<option th:each="c : ${chapterViewDtoList}"
								th:value="${c != null ? c.viewId : ''}"
								th:data-book="${c != null && c.sankouBooksViewDto != null ? c.sankouBooksViewDto.viewId : ''}"
								th:text="${c != null ? (c.no + ' ' + c.name) : ''}">
							01 章タイトル
						</option>
					</select>
				</div>
				<div id="chapter-error" class="my-invalid" th:data-text="${chapterInvalidMessage} ?: ''"></div>
			</div>

			<!-- 問題番号 -->
			<div class="my-validation-container">
				<div class="my-form-input" data-text="問題番号（1..999）">
					<input th:field="*{questionNo}" type="number" min="1" max="999" step="1" required
						aria-describedby="qno-error">
				</div>
				<div id="qno-error" class="my-invalid" th:data-text="${questionNoInvalidMessage} ?: ''"></div>
			</div>

			<!-- 正答 -->
			<div class="my-validation-container">
				<div class="my-form-input" data-text="正答（例：AとCの場合、AC）">
					<input th:field="*{correctOption}" type="text" required maxlength="20"
						aria-describedby="correct-error">
				</div>
				<div id="correct-error" class="my-invalid" th:data-text="${correctInvalidMessage} ?: ''"></div>
			</div>

			<!-- 最大回答数 -->
			<div class="my-validation-container">
				<div class="my-form-input" data-text="最大回答数（1以上）">
					<input th:field="*{answerCountMax}" type="number" min="1" step="1" required
						aria-describedby="answermax-error">
				</div>
				<div id="answermax-error" class="my-invalid" th:data-text="${answerCountMaxInvalidMessage} ?: ''"></div>
			</div>

			<!-- 選択肢数 -->
			<div class="my-validation-container">
				<div class="my-form-input" data-text="選択肢数（1以上）">
					<input th:field="*{optionCount}" type="number" min="1" step="1" required
						aria-describedby="optioncount-error">
				</div>
				<div id="optioncount-error" class="my-invalid" th:data-text="${optionCountInvalidMessage} ?: ''"></div>
			</div>

			<!-- 問題本文（任意） -->
			<div class="my-validation-container">
				<div class="my-form-input" data-text="問題本文（HTML任意）">
					<textarea class="my-form-textarea" th:field="*{questionHtml}" rows="6"
						aria-describedby="qhtml-error"></textarea>
				</div>
				<div id="qhtml-error" class="my-invalid" data-text=""></div>
			</div>

			<!-- 解説（任意） -->
			<div class="my-validation-container">
				<div class="my-form-input" data-text="解説（HTML任意）">
					<textarea class="my-form-textarea" th:field="*{explanationHtml}" rows="6"
						aria-describedby="exhtml-error"></textarea>
				</div>
				<div id="exhtml-error" class="my-invalid" data-text=""></div>
			</div>

			<div class="btn-area">
				<button type="button" class="my-btn-primary my-modal-open" data-modal="#insert-update-modal">更新</button>
				<a th:href="@{/admin/kurohonQuestions}" class="my-btn-secondary">キャンセル</a>
			</div>
		</form>
	</main>

	<!-- browser-guard -->
	<div th:replace="~{admin/browser-guard :: admin-browser-guard}"></div>
	<!-- footer -->
	<div th:replace="~{admin/footer :: admin-footer}"></div>

	<!-- 確認モーダル -->
	<div class="my-modal my-modal-dark" id="insert-update-modal"
		 data-bind-from="input[name='questionNo']"
		 data-bind-to=".js-modal-text"
		 data-bind-template="問題Noを「{value}」に更新してよろしいですか？">
		<div class="my-modal-contents">
			<div class="my-modal-dialog">
				<div class="my-modal-content">
					<div class="my-modal-header">
						<h5 class="my-modal-title">黒本問題更新確認</h5>
						<button type="button" class="my-btn-dark" data-dismiss>&times;</button>
					</div>
					<div class="my-modal-body">
						<p class="js-modal-text"></p>
					</div>
					<div class="my-modal-footer">
						<button type="button" class="my-btn-secondary" data-dismiss>キャンセル</button>
						<button type="submit" class="my-btn-primary" data-submit-form="#insert-update-form">更新</button>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>

</html>
