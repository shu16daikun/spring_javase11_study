<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<!-- head要素ここから -->

<head th:replace="~{admin/common :: admin-header('管理者_参考書カラー設定画面', ~{::extraHead})}">
	<!-- ページ固有の情報をheaderに追加 -->
	<th:block th:fragment="extraHead">
		<!-- 自作個別css -->
		<link rel="stylesheet" media="all" th:href="@{/css/main-contents/admin/sankou-book-color/setting.css}">
		<link rel="stylesheet" media="all" th:href="@{/psfm/css/fragment/breadcrump.css}">
		<link rel="stylesheet" media="all" th:href="@{/psfm/css/fragment/table.css}">
		<link rel="stylesheet" media="all" th:href="@{/psfm/css/fragment/buttons.css}">
		<link rel="stylesheet" media="all" th:href="@{/css/fragment/colorTheme.css}">
		<link rel="stylesheet" media="all" th:href="@{/psfm/css/fragment/pagination.css}">

		<!-- 自作個別js -->
		<script type="module" th:src="@{/js/main-contents/admin/sankou-book-color/setting/controller.js}"></script>
	</th:block>
</head>
<!-- head要素ここまで -->
<!-- body要素ここから -->

<body class="my-items-center-body">
	<!-- navbar -->
	<div th:replace="~{admin/navbar :: admin-navbar}"></div>
	<!-- main-contents -->
	<main class="my-container">
		<!-- breadcrump -->
		<div class="my-breadcrump-simple">
			<nav>
				<ol>
					<li><a th:href="@{/admin}">ホーム</a></li>
					<li>参考書カラー設定</li>
				</ol>
			</nav>
		</div>

		<!-- table -->
		<div class="table-area">
			<div class="my-table">
				<table>
					<thead>
						<tr>
							<th>データベースID</th>
							<th>画面表示用ID</th>
							<th>参考書カラー名</th>
							<th>カラー</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="sc : ${sankouBookColorViewDtoList}">
							<td th:text="${sc.id}">データベースID</td>
							<td th:text="${sc.viewId}">画面表示用ID</td>
							<td th:text="${sc.name}">参考書カラー名</td>
							<td th:class="${sc.colorEnum.getThemeClass()}"></td>
						</tr>
					</tbody>
				</table>
			</div>
			<!-- テーブル直後に追記 -->
			<nav class="my-pagination" id="sbc-pagination" aria-label="参考書カラー ページ移動">
				<ul></ul>
			</nav>
		</div>
	</main>
	
	<!-- browser-guard -->
	<div th:replace="~{admin/browser-guard :: admin-browser-guard}"></div>
	<!-- footer -->
	<div th:replace="~{admin/footer :: admin-footer}"></div>

	<!-- 削除処理フォーム -->
	<form id="delete-form" method="post"
		th:attr="data-action-prefix=@{/admin/sankouBooks/},data-action-suffix='/delete'">
		<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
		<input type="hidden" name="pageToken" th:value="${pageToken}">
	</form>

	<!-- 削除確認モーダル -->
	<div class="my-modal my-modal-dark" id="delete-modal">
		<div class="my-modal-contents">
			<div class="my-modal-dialog">
				<div class="my-modal-content">
					<div class="my-modal-header">
						<h5 class="my-modal-title">参考書カラー削除確認</h5>
						<button type="button" class="my-btn-dark" data-dismiss>&times;</button>
					</div>
					<div class="my-modal-body">
						<p>参考書カラー名「<span id="delete-target-name"></span>」を削除してよろしいですか？</p>
					</div>
					<div class="my-modal-footer">
						<button type="button" class="my-btn-secondary" data-dismiss>キャンセル</button>
						<button type="submit" class="my-btn-danger" data-submit-form="#delete-form">削除</button>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>
<!-- body要素ここまで -->

</html>
