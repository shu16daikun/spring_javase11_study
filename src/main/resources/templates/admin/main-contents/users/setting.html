	<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{admin/common :: admin-header('管理者_ユーザー設定画面', ~{::extraHead})}">
	<th:block th:fragment="extraHead">
		<link rel="stylesheet" media="all" th:href="@{/css/main-contents/admin/users/setting.css}">
		<link rel="stylesheet" media="all" th:href="@{/psfm/css/fragment/breadcrump.css}">
		<link rel="stylesheet" media="all" th:href="@{/psfm/css/fragment/table.css}">
		<link rel="stylesheet" media="all" th:href="@{/psfm/css/fragment/buttons.css}">
		<link rel="stylesheet" media="all" th:href="@{/psfm/css/fragment/pagination.css}">
		<script type="module" th:src="@{/js/main-contents/admin/users/setting/controller.js}"></script>
	</th:block>
</head>

<body class="my-items-center-body">
	<!-- navbar -->
	<div th:replace="~{admin/navbar :: admin-navbar}"></div>

	<main class="my-container">
		<!-- パンくず -->
		<div class="my-breadcrump-simple">
			<nav>
				<ol>
					<li><a th:href="@{/admin}">ホーム</a></li>
					<li>ユーザ設定</li>
				</ol>
			</nav>
		</div>

		<!-- 新規作成ボタン：/admin/users/insert/browser-guard へ POST -->
		<div class="btn-area my-card">
			<form th:action="@{/admin/users/insert/browser-guard}"
			      method="post"
			      data-psfm-prevent-double-submit>
				<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
				<input type="hidden" name="pageToken" th:value="${pageToken}" />
				<button type="submit" class="my-btn-success">新規作成</button>
			</form>
		</div>

		<!-- 一覧テーブル -->
		<div class="table-area">
			<div class="my-table">
				<table>
					<thead>
						<tr>
							<th>データベースID</th>
							<th>画面表示用ID</th>
							<th>ユーザー名</th>
							<th>権限名</th>
							<th>初回ログイン判定</th>
							<th></th>
							<th></th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="us : ${usersViewDtoList}">
							<td th:text="${us.id}">データベースID</td>
							<td th:text="${us.viewId}">画面表示用ID</td>
							<td th:text="${us.username}">ユーザー名</td>
							<td th:text="${us.authorityViewDto.systemName}">権限名</td>
							<td th:if="${us.isFirstLogin}">○</td>
							<td th:unless="${us.isFirstLogin}">×</td>

							<!-- ▼ 詳細ボタン列 -->
							<!-- 予約ユーザーは修正不可 -->
							<td th:if="${us.id == 'US0001' or us.id == 'US0002'}">
								<button class="my-btn-primary" disabled>修正不可</button>
							</td>
							<td th:unless="${us.id == 'US0001' or us.id == 'US0002'}">
								<!-- aタグ → 共通フォームを叩くボタンに変更 -->
								<button type="button"
								        class="my-btn-primary js-users-detail"
								        th:attr="data-view-id=${us.viewId}">
									詳細
								</button>
							</td>

							<!-- ▼ 削除ボタン列 -->
							<!-- 予約ユーザー or 使用中は削除不可 -->
							<td th:if="${us.id == 'US0001' or us.id == 'US0002' or us.isUse}">
								<button class="my-btn-danger" disabled>削除不可</button>
							</td>
							<td th:unless="${us.id == 'US0001' or us.id == 'US0002' or us.isUse}">
								<button type="button"
								        class="my-btn-danger my-modal-open js-users-delete"
								        data-modal="#delete-modal"
								        th:attr="data-view-id=${us.viewId},
								                 data-name=${us.username}">
									削除
								</button>
							</td>
						</tr>
					</tbody>
				</table>
			</div>

			<!-- ページネーション -->
			<nav class="my-pagination" id="users-pagination" aria-label="ユーザー ページ移動">
				<ul></ul>
			</nav>
		</div>
	</main>

	<!-- browser-guard -->
	<div th:replace="~{admin/browser-guard :: admin-browser-guard}"></div>
	<!-- footer -->
	<div th:replace="~{admin/footer :: admin-footer}"></div>

	<!-- ▼ 詳細用：/admin/users/{id}/browser-guard へ POSTする共通フォーム -->
	<form id="users-detail-form"
	      method="post"
	      th:attr="data-action-prefix=@{/admin/users/},data-action-suffix='/browser-guard'">
		<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
		<input type="hidden" name="pageToken" th:value="${pageToken}" />
	</form>

	<!-- ▼ 削除処理フォーム -->
	<form id="delete-form"
	      method="post"
	      th:attr="data-action-prefix=@{/admin/users/},data-action-suffix='/delete'">
		<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
		<input type="hidden" name="pageToken" th:value="${pageToken}" />
	</form>

	<!-- 削除確認モーダル -->
	<div class="my-modal my-modal-dark" id="delete-modal">
		<div class="my-modal-contents">
			<div class="my-modal-dialog">
				<div class="my-modal-content">
					<div class="my-modal-header">
						<h5 class="my-modal-title">ユーザー削除確認</h5>
						<button type="button" class="my-btn-dark" data-dismiss>&times;</button>
					</div>
					<div class="my-modal-body">
						<p>ユーザー名「<span id="delete-target-name"></span>」を削除してよろしいですか？</p>
					</div>
					<div class="my-modal-footer">
						<button type="button" class="my-btn-secondary" data-dismiss>キャンセル</button>
						<button type="submit" class="my-btn-danger" data-submit-form="#delete-form">削除</button>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>

</html>
