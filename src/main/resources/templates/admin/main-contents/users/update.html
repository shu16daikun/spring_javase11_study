<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<!-- [head] START -->

<head th:replace="~{admin/common :: admin-header('管理者_ユーザー修正画面', ~{::extraHead})}">
	<th:block th:fragment="extraHead">
		<!-- 個別CSS -->
		<link rel="stylesheet" media="all" th:href="@{/css/main-contents/admin/users/insertUpdate.css}">
		<link rel="stylesheet" media="all" th:href="@{/psfm/css/fragment/signin.css}">
		<link rel="stylesheet" media="all" th:href="@{/psfm/css/fragment/body.css}">
		<link rel="stylesheet" media="all" th:href="@{/psfm/css/fragment/buttons.css}">
		<link rel="stylesheet" media="all" th:href="@{/psfm/css/fragment/breadcrump.css}">
		<link rel="stylesheet" media="all" th:href="@{/psfm/css/fragment/form.css}">
		<link rel="stylesheet" media="all" th:href="@{/psfm/css/fragment/validation.css}">
		<link rel="stylesheet" media="all" th:href="@{/psfm/css/fragment/alert.css}">
		<link rel="stylesheet" media="all" th:href="@{/psfm/css/fragment/select.css}">
		<!-- 個別JS -->
		<script type="module" th:src="@{/js/main-contents/admin/users/insert-update/controller.js}"></script>
	</th:block>
</head>
<!-- [head] END -->

<!-- [body] START -->

<body>
	<!-- [fragment: navbar] START -->
	<div th:replace="~{admin/navbar :: admin-navbar}"></div>
	<!-- [fragment: navbar] END -->

	<!-- [main] START -->
	<main class="my-container-left">
		<!-- パンくず -->
		<div class="my-breadcrump-simple">
			<nav>
				<ol>
					<li><a th:href="@{/admin}">ホーム</a></li>
					<li><a th:href="@{/admin/users}">ユーザー設定</a></li>
					<li>ユーザー修正</li>
				</ol>
			</nav>
		</div>

		<!-- 更新フォーム -->
		<form th:action="@{/admin/users/{users_view_id}/update(users_view_id=${users_view_id})}"
			  th:object="${usersForm}"
			  class="my-validation-input-change"
			  method="post"
			  id="insert-update-form"
			  novalidate>
			<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
			<input type="hidden" name="pageToken" th:value="${pageToken}">
			<!-- 対象ユーザーの ViewId -->
			<input type="hidden" name="viewId" th:value="${viewId} ?: ${usersViewDto?.viewId}">

			<!-- アラート -->
			<div class="alert-area" th:if="${errorMessage != null}">
				<div th:if="${alertDanger}" class="my-alert-danger" th:data-text="${errorMessage}"></div>
			</div>

			<div class="my-form-message"></div>

			<!-- ユーザー名 -->
			<div class="my-validation-container">
				<div class="my-form-input" data-text="ユーザー名">
					<input th:field="*{username}" type="text" required minlength="8" maxlength="20"
						   aria-describedby="username-error">
				</div>
				<div id="username-error" class="my-invalid" th:data-text="${usernameInvalidMessage} ?: ''"></div>
			</div>

			<!-- 権限 -->
			<div class="my-validation-container">
				<div class="my-form-input is-select" data-text="権限（例: ADMIN）">
					<select class="my-select" th:field="*{authorityViewId}" aria-describedby="authority-error" required>
						<option value="">選択してください</option>
						<option th:each="a : ${authorityViewDtoList}"
								th:value="${a != null ? a.viewId : ''}"
								th:text="${a != null ? (a.systemName != null ? a.systemName : a.name) : ''}">
							ADMIN
						</option>
					</select>
				</div>
				<div id="authority-error" class="my-invalid" th:data-text="${authorityInvalidMessage} ?: ''"></div>
			</div>

			<!-- ボタン -->
			<div class="btn-area">
				<button type="button" class="my-btn-primary my-modal-open" data-modal="#insert-update-modal">更新</button>
				<a th:href="@{/admin/users}" class="my-btn-secondary">キャンセル</a>
				<button type="button" class="my-btn-warning my-modal-open"
						data-modal="#pass-reset-modal">パスワードリセット</button>
			</div>
		</form>

		<!-- パスワードリセット送信フォーム -->
		<form th:action="@{/admin/users/{users_view_id}/passwordReset(users_view_id=${users_view_id})}"
			  method="post"
			  id="pass-reset-form">
			<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
			<input type="hidden" name="pageToken" th:value="${pageToken}">
			<input type="hidden" name="viewId" th:value="${viewId} ?: ${usersViewDto?.viewId}">
		</form>
	</main>
	<!-- [main] END -->
	
	<!-- browser-guard -->
	<div th:replace="~{admin/browser-guard :: admin-browser-guard}"></div>

	<!-- [fragment: footer] START -->
	<div th:replace="~{admin/footer :: admin-footer}"></div>
	<!-- [fragment: footer] END -->

	<!-- 更新確認モーダル -->
	<div class="my-modal my-modal-dark" id="insert-update-modal"
		 data-bind-from="input[name='username']"
		 data-bind-to=".js-modal-text"
		 data-bind-template="ユーザー名を「{value}」に更新してよろしいですか？">
		<div class="my-modal-contents">
			<div class="my-modal-dialog">
				<div class="my-modal-content">
					<div class="my-modal-header">
						<h5 class="my-modal-title">ユーザー更新確認</h5>
						<button type="button" class="my-btn-dark" data-dismiss>&times;</button>
					</div>
					<div class="my-modal-body">
						<p class="js-modal-text"></p>
					</div>
					<div class="my-modal-footer">
						<button type="button" class="my-btn-secondary" data-dismiss>キャンセル</button>
						<button type="submit" class="my-btn-primary" data-submit-form="#insert-update-form">更新</button>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- パスワードリセット確認モーダル -->
	<div class="my-modal my-modal-dark" id="pass-reset-modal">
		<div class="my-modal-contents">
			<div class="my-modal-dialog">
				<div class="my-modal-content">
					<div class="my-modal-header">
						<h5 class="my-modal-title">パスワードリセット確認</h5>
						<button type="button" class="my-btn-dark" data-dismiss>&times;</button>
					</div>
					<div class="my-modal-body">
						<p>対象ユーザーのパスワードを初期化してもよろしいですか？</p>
					</div>
					<div class="my-modal-footer">
						<button type="button" class="my-btn-secondary" data-dismiss>キャンセル</button>
						<button type="submit" class="my-btn-warning"
								data-submit-form="#pass-reset-form">パスワードリセット</button>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>
<!-- [body] END -->

</html>
