<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<!-- head要素ここから -->

<head th:replace="~{admin/common :: admin-header('管理者_解答セッション設定画面', ~{::extraHead})}">
	<!-- ページ固有の情報をheaderに追加 -->
	<th:block th:fragment="extraHead">
		<!-- 自作個別css -->
		<link rel="stylesheet" media="all" th:href="@{/css/main-contents/admin/attempt-session/setting.css}">
		<link rel="stylesheet" media="all" th:href="@{/psfm/css/fragment/breadcrump.css}">
		<link rel="stylesheet" media="all" th:href="@{/psfm/css/fragment/table.css}">
		<link rel="stylesheet" media="all" th:href="@{/psfm/css/fragment/buttons.css}">
		<link rel="stylesheet" media="all" th:href="@{/psfm/css/fragment/pagination.css}">
		<!-- 自作個別js -->
		<script type="module" th:src="@{/js/main-contents/admin/attempt-session/setting/controller.js}"></script>
	</th:block>
</head>
<!-- head要素ここまで -->
<!-- body要素ここから -->

<body class="my-items-center-body">
	<!-- navbar -->
	<div th:replace="~{admin/navbar :: admin-navbar}"></div>
	<!-- main-contents -->
	<main class="my-container">
		<!-- breadcrump -->
		<div class="my-breadcrump-simple">
			<nav>
				<ol>
					<li><a th:href="@{/admin}">ホーム</a></li>
					<li>解答セッションデータ閲覧</li>
				</ol>
			</nav>
		</div>
		<!-- table -->
		<div class="table-area">
			<div class="my-table">
				<table>
					<thead>
						<tr>
							<th>データベースID</th>
							<th>画面表示用ID</th>
							<th>ユーザ名</th>
							<th>参考書名</th>
							<th>解答開始日時</th>
							<th>解答終了日時</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="as : ${attemptSessionViewDtoList}">
							<td th:text="${as.id}">データベースID</td>
							<td th:text="${as.viewId}">画面表示用ID</td>
							<td th:text="${as.usersViewDto.username}">ユーザ名</td>
							<td th:text="${as.sankouBooksViewDto.name}">参考書名</td>
							<td th:text="${as.startedAt}">解答開始日時</td>
							<td th:text="${as.finishedAt}">解答終了日時</td>
						</tr>
					</tbody>
				</table>
			</div>
			<nav class="my-pagination" id="attempt-session-pagination" aria-label="解答セッションページ移動">
				<ul></ul>
			</nav>
		</div>
	</main>
	
	<!-- browser-guard -->
	<div th:replace="~{admin/browser-guard :: admin-browser-guard}"></div>
	<!-- footer -->
	<div th:replace="~{admin/footer :: admin-footer}"></div>
</body>
<!-- body要素ここまで -->

</html>
