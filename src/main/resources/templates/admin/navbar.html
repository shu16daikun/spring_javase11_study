<!-- 共通アイコン読み込み -->
<div class="my-navbar-admin" th:fragment="admin-navbar">
	<div th:replace="~{psfm/fragment/svg/icons :: svg-icons}"></div>
	<nav>
		<div class="my-container-fluid">
			<a class="my-title" th:href="@{/admin}">JavaSE11 資格勉強 管理者画面</a>
			<!-- トグルボタン -->
			<a class="my-navbar-toggler" aria-label="メニューを開く"></a>
			<div class="my-offcanvas-admin">
				<!-- Offcanvas本体 -->
				<div class="my-offcanvas">
					<div class="my-offcanvas-header">
						<span>メニュー</span>
						<button class="my-offcanvas-close" aria-label="閉じる">&times;</button>
					</div>
					<div class="my-offcanvas-body">
						<ul>
							<li data-text="権限TBL設定" th:data-href="@{/admin/authority}"></li>
							<li data-text="ユーザーTBL設定" th:data-href="@{/admin/users}"></li>
							<li data-text="参考書カラーTBL設定" th:data-href="@{/admin/sankouBookColor}"></li>
							<li data-text="参考書TBL設定" th:data-href="@{/admin/sankouBooks}"></li>
							<li data-text="章TBL設定" th:data-href="@{/admin/chapter}"></li>
							<li data-text="黒本問題TBL設定" th:data-href="@{/admin/kurohonQuestions}"></li>
							<li data-text="解答セッションTBL設定" th:data-href="@{/admin/attemptSession}"></li>
							<li data-text="解答履歴TBL設定" th:data-href="@{/admin/answerRecords}"></li>
							<li data-text="苦手分析TBL設定" th:data-href="@{/admin/weakness}"></li>
							<li data-text="ログアウト" data-modal="#logout-modal"></li>
						</ul>
					</div>
				</div>
			</div>
		</div>
	</nav>
	<div class="navbar-spacer"></div>
	<!-- ログアウトフォーム　-->
	<form id="logout-form" th:action="@{/logout}" method="post">
		<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
	</form>
	<!-- ログアウト確認モーダル -->
	<div class="my-modal my-modal-dark" id="logout-modal">
		<div class="my-modal-contents">
			<div class="my-modal-dialog">
				<div class="my-modal-content">
					<div class="my-modal-header">
						<h5 class="my-modal-title">ログアウト確認</h5>
						<button type="button" class="my-btn-dark" data-dismiss>&times;</button>
					</div>
					<div class="my-modal-body">
						<p>ログアウトしてよろしいですか？</p>
					</div>
					<div class="my-modal-footer">
						<button type="button" class="my-btn-secondary" data-dismiss>
							キャンセル
						</button>
						<button type="submit" class="my-btn-danger" data-submit-form="#logout-form">
							ログアウト
						</button>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
