# =========================================
# error.properties  （UTF-8）
# =========================================

########## Common: Validation ##########
error.common.notblank={0}は必須です。
error.common.min={0}は{1}文字以上で設定してください。
error.common.max={0}は{1}文字以下で設定してください。
error.common.size={0}は{1}文字以上、{2}文字以下で設定してください。

########## Common: Generic ##########
error.common.unexpected=エラーが発生しました。時間をおいて再度お試しください。
error.common.badrequest=不正なリクエストです。
error.common.forbidden=アクセスが許可されていません。
error.common.notfound=お探しの情報は見つかりませんでした。
error.common.notfound.generic=お探しの情報は見つかりませんでした。
error.common.duplicateid=IDが既に存在します。   # ← これを使い回す

########## Login ##########
error.login.mismatch=ユーザー情報が間違っています。
error.login.logout.success=ログアウトしました。

########## Authortiy ##########
error.authority.name.pattern=権限名は「ROLE_」から始まり、英大文字・数字・アンダースコアのみ（全体20文字以内）で入力してください
error.authority.systemname.pattern=権限名は英大文字・数字・アンダースコアのみ（全体20文字以内）で入力してください

########## Users / Account ##########
error.user.username.pattern=ユーザー名は8文字以上20文字以下の半角数字、半角英字（大文字、小文字）で設定してください。
error.user.password.pattern=パスワードは半角数字、半角英字、記号（「!」「/」「&」「@」）の3種類を全て用いた8文字以上で設定してください。
error.user.password.mismatch=パスワードが一致しません。

########## SankouBookColor ##########
error.sankoubookcolor.name.blank=参考書カラー名が空欄です。
error.sankoubookcolor.name.duplicate=同じ参考書カラー名が既に存在します。
error.sankoubookcolor.name.pattern=不正な値が入力されました。
error.sankoubookcolor.inuse=この参考書カラーは使用中のため削除できません。

########## SankouBooks ##########
error.sankoubooks.name.blank=参考書名が空欄です。
error.sankoubooks.color.blank=参考書カラーが指定されていません。
error.sankoubooks.name.duplicate=同じ参考書名が既に存在します。
error.sankoubooks.inuse=この参考書は使用中のため削除できません。

########## Kurohon Questions ##########
# NOT_ENTITY（KQ-404-01）用
error.kurohon.questions.notfound=該当する黒本問題が見つかりません。
# DTO_MISMATCH（KQ-400-01 / AR-400-01）用
error.kurohon.questions.dto.mismatch=指定された黒本問題DTOが不正です。
# DUPLICATE_QUESTION_NO（KQ-409-01）用
error.kurohon.questions.duplicateno=同じ問題番号が既に存在します。
# INVALID_CORRECT_OPTION（KQ-422-01）用
error.kurohon.questions.correct.invalid=正解の選択肢が不正です。
# INVALID_OPTION_COUNT（KQ-422-02）用
error.kurohon.questions.optioncount.invalid=選択肢数が不正です。
# IN_USE（KQ-409-02）用
error.kurohon.questions.inuse=この黒本問題は使用中のため削除できません。

########## Answer / Selected Option ##########
error.answer.notfound=該当する解答データが見つかりません。
error.answer.selectedoption.pattern=不正な値が入力されました。
error.answer.selectedoption.unknown=「わからない」とほかの選択肢は同時に選択できません。
error.answer.selectedoption.max=選択は最大{0}個までです。

########## Chapter ##########
# NOT_ENTITY（CH-404-01）用
error.chapter.notfound=該当する章が見つかりません。
# DUPLICATE_NO（CH-409-01）用
error.chapter.duplicateno=同じ章番号が既に存在します。
# IN_USE（CH-409-02）用
error.chapter.inuse=この章は使用中のため削除できません。

########## Attempt Session ##########
# NOT_ENTITY（AS-404-01）用
error.attemptsession.notfound=該当する解答セッションが見つかりません。
# ALREADY_FINISHED（AS-409-01）用
error.attemptsession.alreadyfinished=この解答セッションはすでに終了しています。
# IN_USE（AS-409-02）用
error.attemptsession.inuse=この解答セッションは使用中のため削除できません。

########## Weakness ##########
error.weakness.notfound=該当する弱点データが見つかりません。
